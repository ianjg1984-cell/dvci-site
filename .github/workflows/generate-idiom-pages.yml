name: Generate idiom pages

on:
  push:
    branches: [main]
    paths:
      - "assets/data.js"
      - "scripts/generate-idiom-pages.js"
      - ".github/workflows/generate-idiom-pages.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate idiom pages
        run: node scripts/generate-idiom-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "dvci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add idioms/ sitemap.xml a-z.html
          if git diff --cached --quiet; then
            echo "No changes to generated pages."
          else
            git commit -m "Auto-generate idiom pages"
            git push
          fi
