name: Generate old wives' tales pages

on:
  push:
    branches: [main]
    paths:
      - "assets/old-wives-tales-data.js"
      - "scripts/generate-old-wives-tales-pages.js"
      - ".github/workflows/generate-old-wives-tales-pages.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate old wives' tales pages
        run: node scripts/generate-old-wives-tales-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "dvci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add old-wives-tales/ old-wives-tales.html
          if git diff --cached --quiet; then
            echo "No changes to generated pages."
          else
            git commit -m "Auto-generate old wives' tales pages"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying after pull --rebase..."
              sleep 5
            done
          fi
