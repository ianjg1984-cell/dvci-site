name: Daily idiom research

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Research and add new idioms
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/daily-idiom-research.js

      - name: Commit new idioms
        run: |
          git config user.name "dvci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data.js
          if git diff --cached --quiet; then
            echo "No new idioms today."
          else
            git commit -m "Add new idioms from daily research"
            git push
          fi
